<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0509">
<title>HAPPY BIRTHDAY</title>
<style>
  :root{
    --gold:#ff9ec4;
    --gold-dim:#c77e9c;
    --ink:#fdf2f6;
    --bg:#0a0509;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    background:
      radial-gradient(1200px 700px at 50% 18%, #2a1522 0%, transparent 62%),
      radial-gradient(900px 600px at 80% 85%, #331a2a 0%, transparent 60%),
      radial-gradient(700px 500px at 12% 78%, #1e1220 0%, transparent 62%),
      var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* 细颗粒质感 */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.6'/></svg>");
  }
  /* 暗角 */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(0,0,0,.55) 100%);
  }
  canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1}

  /* 背景极光光斑（缓慢漂移） */
  .aurora{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;will-change:transform}
  .a1{width:62vw;height:62vw;left:-14vw;top:-24vh;opacity:.55;
      background:radial-gradient(circle,#4a1e33 0%,rgba(27,43,77,0) 68%);
      animation:drift1 26s ease-in-out infinite alternate}
  .a2{width:54vw;height:54vw;right:-12vw;bottom:-22vh;opacity:.45;
      background:radial-gradient(circle,#5b2440 0%,rgba(59,35,56,0) 68%);
      animation:drift2 33s ease-in-out infinite alternate}
  .a3{width:40vw;height:40vw;left:32vw;top:22vh;opacity:.30;
      background:radial-gradient(circle,#43202f 0%,rgba(58,47,24,0) 70%);
      animation:drift1 19s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate3d(7vw,5vh,0) scale(1.10)}}
  @keyframes drift2{to{transform:translate3d(-6vw,-4vh,0) scale(1.14)}}

  .stage{
    position:fixed;inset:0;z-index:3;
    display:grid;place-items:center;
    padding:6vmin;
    pointer-events:none;
  }

  .card{
    pointer-events:auto;
    width:min(560px,88vw);
    padding:clamp(28px,4.4vmin,44px) clamp(24px,4vmin,40px);
    text-align:center;
    border-radius:20px;
    background:linear-gradient(160deg, rgba(54,29,44,.86), rgba(20,10,16,.90));
    border:1px solid rgba(255,158,196,.42);
    box-shadow:
      0 0 90px rgba(255,158,196,.10),
      0 30px 80px -30px rgba(0,0,0,.9),
      inset 0 1px 0 rgba(255,255,255,.10);
    opacity:0;transform:translateY(18px) scale(.985);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.2,.7,.2,1);
  }
  .card.on{opacity:1;transform:none}

  .eyebrow{
    font-size:clamp(10px,1.25vmin,12px);
    letter-spacing:.52em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:1.35em;
    padding-left:.52em; /* 抵消末字间距 */
  }
  .rule{
    width:44px;height:1px;margin:0 auto 1.5em;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.7;
  }
  h1{
    font-family:"Georgia","Times New Roman","Songti SC",serif;
    font-weight:500;
    font-size:clamp(28px,4.6vmin,44px);
    letter-spacing:.06em;
    line-height:1.35;
    color:#fff2f7;
    text-shadow:0 0 28px rgba(255,158,196,.35);
    margin-bottom:.55em;
  }
  .msg{
    font-size:clamp(13px,1.65vmin,15px);
    line-height:2.05;
    color:rgba(252,248,240,.90);
    letter-spacing:.04em;
    white-space:pre-line;
  }
  .date{
    margin-top:1.9em;
    font-family:"Georgia",serif;
    font-size:clamp(10px,1.3vmin,12px);
    letter-spacing:.34em;
    color:#d98aa6;
    text-transform:uppercase;
  }
  .actions{margin-top:2.2em;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button{
    font:inherit;font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(244,239,230,.82);
    background:transparent;
    border:1px solid rgba(255,158,196,.28);
    border-radius:999px;
    padding:10px 22px;
    cursor:pointer;
    transition:.35s ease;
  }
  button:hover{color:#fff;border-color:rgba(255,158,196,.7);background:rgba(255,158,196,.06)}
  button:active{transform:translateY(1px)}

  .hint{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom, 0px) + clamp(18px,3.4vmin,34px));
    transform:translateX(-50%);
    z-index:6;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(244,239,230,.34);
    opacity:0;transition:opacity 1.4s ease 1s;pointer-events:none;
  }
  .hint.on{opacity:1}

  .wish{
    position:fixed;left:50%;top:22%;transform:translateX(-50%);
    z-index:3;pointer-events:none;
    font-size:clamp(10px,2.6vmin,12px);
    letter-spacing:.62em;text-indent:.62em;text-transform:uppercase;
    color:rgba(255,196,216,.62);
    opacity:0;transition:opacity 1.2s ease;
  }
  .wish.on{opacity:1}

  /* 定格预览：关掉过渡，避免截图时停在中间态 */
  body.still .card{transition:none !important}
  body.still .hint{transition:none !important;opacity:1}

  /* ---------- 密码门 ---------- */
  .lock{
    position:fixed;inset:0;z-index:9;
    display:grid;place-items:center;
    background:radial-gradient(1200px 700px at 50% 40%,#2a1522 0%,#0b0509 68%);
    transition:opacity .9s ease, visibility .9s ease;
  }
  .lock.gone{opacity:0;visibility:hidden;pointer-events:none}
  .lock .panel{
    width:min(400px,86vw);
    padding:clamp(30px,5vmin,46px) clamp(22px,4vmin,34px);
    text-align:center;
    border-radius:18px;
    background:linear-gradient(160deg, rgba(54,29,44,.80), rgba(12,6,10,.90));
    border:1px solid rgba(255,158,196,.30);
    box-shadow:0 0 80px rgba(255,158,196,.07), 0 30px 70px -30px #000;
  }
  .lock .mark{
    width:34px;height:34px;margin:0 auto 1.5em;
    border:1px solid rgba(255,158,196,.45);border-radius:50%;
    display:grid;place-items:center;
  }
  .lock .mark::after{
    content:"";width:8px;height:8px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 12px var(--gold);
  }
  .lock h2{
    font-size:clamp(15px,2vmin,17px);
    font-weight:500;letter-spacing:.22em;
    color:#fdf2f6;margin-bottom:.5em;
  }
  .lock .sub{
    font-size:11px;letter-spacing:.2em;color:rgba(244,239,230,.42);
    text-transform:uppercase;margin-bottom:2em;
  }
  .lock input{
    width:100%;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,158,196,.28);
    border-radius:12px;
    padding:15px 10px;
    font-family:Consolas,"SF Mono",monospace;
    font-size:20px;letter-spacing:.5em;
    text-align:center;text-indent:.5em;
    color:#fff2f7;outline:none;
    transition:.3s ease;
  }
  .lock input:focus{border-color:rgba(255,158,196,.75);box-shadow:0 0 0 4px rgba(255,158,196,.07)}
  .lock .err{height:1.4em;margin:.9em 0 .2em;font-size:11.5px;letter-spacing:.12em;color:#e08a7a}
  .lock button{width:100%;margin-top:.6em;padding:13px 0;letter-spacing:.42em;text-indent:.42em}
  .lock.shake .panel{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{
    10%,90%{transform:translateX(-2px)}
    20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}
    40%,60%{transform:translateX(7px)}
  }

  @media (max-width:520px){
    .card{padding:26px 22px}
    .msg{line-height:1.95}
  }
  @media (prefers-reduced-motion:reduce){
    .card{transition:none}
  }
</style>
</head>
<body>
<div class="aurora a1"></div>
<div class="aurora a2"></div>
<div class="aurora a3"></div>

<div class="lock" id="lock">
  <div class="panel">
    <div class="mark"></div>
    <h2>需要访问许可</h2>
    <p class="sub">Enter the 8-digit code</p>
    <input id="pw" type="text" inputmode="numeric" maxlength="8" autocomplete="off" spellcheck="false" placeholder="········">
    <p class="err" id="err"></p>
    <button id="enter">进 入</button>
  </div>
</div>

<canvas id="fx"></canvas>

<div class="stage">
  <section class="card" id="card">
    <p class="eyebrow">Happy Birthday</p>
    <div class="rule"></div>
    <h1 id="name">致 · 你</h1>
    <p class="msg" id="msg">愿新的一岁，眼里有光，心中有海。所求皆如愿，所行化坦途。</p>
    <p class="date" id="date">2026 · 生日快乐</p>
    <div class="actions">
      <button id="again">再看一次</button>
      <button id="sound">开启声音</button>
    </div>
  </section>
</div>

<div class="hint" id="hint">点击任意处 · 放一束烟花</div>
<div class="wish" id="wish">Make a wish</div>

<script>
(() => {
  "use strict";

  /* ============ 配置：改这里就行，或直接用网址参数 ============
     birthday.html?name=小美&msg=第一行%0A第二行&date=2026.11.01      */
  const CONFIG = {
    pass:  "20081107",                 // 开启密码
    name:  "致 · 梓伊",
    msg:   "梓伊，生日快乐。\n愿你被这个世界温柔以待，\n也愿你有力量，去温柔地对待自己。",
    date:  "2008 · 11 · 07",
    lines: ["HAPPY", "BIRTHDAY"]     // 粒子拼出来的字
  };

  const qs = new URLSearchParams(location.search);
  const still = qs.get("still") || "";      // "" | "card" | "text"，仅用于截图预览
  if (still) document.body.classList.add("still");
  const PASS = qs.get("pw") || CONFIG.pass;
  const name = qs.get("name") || CONFIG.name;
  const msg  = qs.get("msg")  || CONFIG.msg;
  const date = qs.get("date") || CONFIG.date;
  document.getElementById("name").textContent = name;
  document.getElementById("msg").textContent  = msg;
  document.getElementById("date").textContent = date;
  document.title = "生日快乐 · " + name.replace(/^致\s*·\s*/, "");

  /* ---------------- 画布 ---------------- */
  const cv = document.getElementById("fx");
  const ctx = cv.getContext("2d", { alpha: true });
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + "px";
    cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------------- 时间轴 ---------------- */
  const T = {
    gather: 2400,     // 粒子汇聚
    hold:   2300,     // 停留
    dissolve: 1500    // 散开
  };
  let t0 = performance.now() - (parseFloat(qs.get("t")) || 0) * 1000;
  const now = () => performance.now() - t0;

  /* ---------------- 粒子 ---------------- */
  const COLORS = ["#ffd9e6", "#ff9ec4", "#fff0f6", "#d98aa6", "#ffffff"];
  // 预渲染发光粒子贴图（比逐帧 shadowBlur 快得多）
  const SPRITES = COLORS.map(col => {
    const s = document.createElement("canvas");
    s.width = s.height = 32;
    const g = s.getContext("2d");
    const rg = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    rg.addColorStop(0, "#ffffff");
    rg.addColorStop(0.25, col);
    rg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = rg;
    g.beginPath(); g.arc(16, 16, 16, 0, Math.PI * 2); g.fill();
    return s;
  });
  let particles = [];
  let freeDust = [];
  let fireworks = [];
  let phase = "gather";

  function sampleText() {
    const off = document.createElement("canvas");
    off.width = W; off.height = H;
    const o = off.getContext("2d");
    o.fillStyle = "#fff";
    o.textAlign = "center";
    o.textBaseline = "middle";

    const size = Math.min(W * 0.175, H * 0.245);
    const gap = size * 0.026;
    o.font = `600 ${size}px Georgia, "Times New Roman", serif`;

    const total = CONFIG.lines.length;
    CONFIG.lines.forEach((line, i) => {
      const y = H / 2 + (i - (total - 1) / 2) * size * 1.18;
      o.fillText(line, W / 2, y);
    });

    const img = o.getImageData(0, 0, W, H).data;
    const pts = [];
    const step = Math.max(3, Math.round(gap));
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        if (img[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
      }
    }
    return pts;
  }

  function buildParticles() {
    const pts = sampleText();
    // 太多就抽稀，太少就补
    const maxN = Math.min(9000, Math.max(1500, Math.floor(W * H / 620)));
    const stride = Math.max(1, Math.ceil(pts.length / maxN));

    particles = [];
    for (let i = 0; i < pts.length; i += stride) {
      const [tx, ty] = pts[i];
      const a = Math.random() * Math.PI * 2;
      const r = Math.max(W, H) * (0.55 + Math.random() * 0.55);
      particles.push({
        x: W / 2 + Math.cos(a) * r,
        y: H / 2 + Math.sin(a) * r,
        tx, ty,
        vx: 0, vy: 0,
        size: 0.8 + Math.random() * 1.5,
        delay: Math.random() * 0.35,
        c: COLORS[(Math.random() * COLORS.length) | 0],
        ci: (Math.random() * COLORS.length) | 0,
        tw: Math.random() * Math.PI * 2
      });
    }
    if (still) particles.forEach(p => { p.x = p.tx; p.y = p.ty; });
  }

  /* ---------------- 烟花 ---------------- */
  function spawnFirework(x, y, hueGold = true) {
    const n = 70 + (Math.random() * 50 | 0);
    const power = 2.2 + Math.random() * 2.4;
    const base = Math.random() * Math.PI * 2;
    for (let i = 0; i < n; i++) {
      const a = base + (i / n) * Math.PI * 2 + Math.random() * 0.12;
      const sp = power * (0.35 + Math.random() * 0.9);
      fireworks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.008 + Math.random() * 0.013,
        ci: hueGold
          ? (Math.random() < 0.6 ? 1 : 0)
          : (Math.random() * COLORS.length) | 0,
        size: 1 + Math.random() * 1.7
      });
    }
  }

  /* ---------------- 蛋糕与蜡烛 ---------------- */
  let mode = "candles";          // candles -> text
  let candles = [];
  let smoke = [];
  let blowing = false;
  let blow = 0;                  // 0..1 风力
  let lastOut = -1e9;

  function layoutCandles() {
    const cw = Math.min(W * 0.46, 440);
    const ch = cw * 0.30;
    const cx = W / 2;
    const cy = H * 0.60;
    const topY = cy - ch;
    const n = 5;
    const span = cw * 0.60;
    candles = [];
    for (let i = 0; i < n; i++) {
      candles.push({
        x: cx - span / 2 + (span / (n - 1)) * i,
        topY,
        h: cw * 0.17,
        lit: true,
        seed: Math.random()
      });
    }
    smoke = [];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function puff(c) {
    for (let i = 0; i < 16; i++) {
      smoke.push({
        x: c.x + (Math.random() - 0.5) * 6,
        y: c.topY - c.h * 0.95,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -0.4 - Math.random() * 0.9,
        life: 1,
        size: 3 + Math.random() * 5
      });
    }
  }

  function blowOne() {
    const lit = candles.filter(c => c.lit);
    if (!lit.length) return;
    const c = lit[lit.length - 1];      // 从右往左灭
    c.lit = false;
    puff(c);
    if (candles.every(x => !x.lit)) setTimeout(finishCandles, 950);
  }

  function finishCandles() {
    if (mode !== "candles") return;
    mode = "text";
    smoke = [];
    t0 = performance.now();
    buildParticles();
    setWish(false);
    setHint("点击任意处 · 放一束烟花");
  }

  function updateCandles(dt, ts) {
    if (blowing) blow = Math.min(1, blow + dt / 260);
    else blow = Math.max(0, blow - dt / 420);

    if (!still && blowing && blow > 0.5 && ts - lastOut > 360) {
      lastOut = ts;
      blowOne();
    }
    for (let i = smoke.length - 1; i >= 0; i--) {
      const s = smoke[i];
      s.x += s.vx; s.y += s.vy;
      s.vy *= 0.985;
      s.life -= 0.012;
      s.size += 0.12;
      if (s.life <= 0) smoke.splice(i, 1);
    }
  }

  function drawCake(ts) {
    ctx.clearRect(0, 0, W, H);
    const cw = Math.min(W * 0.46, 440);
    const ch = cw * 0.30;
    const cx = W / 2;
    const cy = H * 0.60;
    const topY = cy - ch;
    const litN = candles.filter(c => c.lit).length;

    // 烛光氛围
    if (litN > 0) {
      ctx.globalCompositeOperation = "lighter";
      const g = ctx.createRadialGradient(cx, topY - 10, 8, cx, topY - 10, cw * 1.05);
      g.addColorStop(0, "rgba(255,150,185,.16)");
      g.addColorStop(0.42, "rgba(255,110,160,.055)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = "source-over";
    }

    // 投影 + 底盘
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.beginPath(); ctx.ellipse(cx, cy + 12, cw * 0.55, ch * 0.13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.05)";
    roundRect(cx - cw * 0.58, cy - 6, cw * 1.16, 12, 6); ctx.fill();

    // 蛋糕主体
    const bg = ctx.createLinearGradient(0, topY, 0, cy);
    bg.addColorStop(0, "#5c2d42"); bg.addColorStop(0.55, "#3e1d2c"); bg.addColorStop(1, "#281120");
    roundRect(cx - cw / 2, topY, cw, ch, 16);
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = "rgba(255,170,200,.26)"; ctx.lineWidth = 1.2; ctx.stroke();

    // 顶部奶油 + 垂边
    const fg = ctx.createLinearGradient(0, topY - ch * 0.16, 0, topY + ch * 0.2);
    fg.addColorStop(0, "#ffd6e4"); fg.addColorStop(1, "#ef9fbe");
    roundRect(cx - cw / 2 + 2, topY - ch * 0.16, cw - 4, ch * 0.34, 14);
    ctx.fillStyle = fg; ctx.fill();
    ctx.fillStyle = "#ef9fbe";
    for (let i = 0; i < 8; i++) {
      const dx = cx - cw / 2 + 20 + i * (cw - 40) / 7;
      ctx.beginPath(); ctx.arc(dx, topY + ch * 0.17, 8.5, 0, Math.PI); ctx.fill();
    }

    // 蜡烛
    for (const c of candles) {
      const h = c.h;
      const bodyTop = topY - h;
      ctx.fillStyle = "#fbe6f0";
      roundRect(c.x - 3.4, bodyTop, 6.8, h, 3); ctx.fill();
      ctx.strokeStyle = "rgba(232,150,185,.45)"; ctx.lineWidth = 1;
      for (let k = 1; k <= 3; k++) {
        const y = bodyTop + h * k / 4;
        ctx.beginPath(); ctx.moveTo(c.x - 3.4, y); ctx.lineTo(c.x + 3.4, y); ctx.stroke();
      }
      ctx.strokeStyle = "rgba(60,30,45,.9)"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(c.x, bodyTop); ctx.lineTo(c.x, bodyTop - 3); ctx.stroke();

      if (c.lit) {
        const fl = 0.9 + Math.sin(ts / 95 + c.seed * 9) * 0.11 + Math.sin(ts / 41 + c.seed * 4) * 0.06;
        const bend = blow * 7.5;
        const fx = c.x + bend;
        const fy = bodyTop - 4;

        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(1, fl);
        ctx.globalCompositeOperation = "lighter";
        const fgr = ctx.createRadialGradient(0, -6, 0, 0, -8, 18);
        fgr.addColorStop(0, "rgba(255,252,240,.98)");
        fgr.addColorStop(0.28, "rgba(255,205,150,.92)");
        fgr.addColorStop(0.62, "rgba(255,150,110,.45)");
        fgr.addColorStop(1, "rgba(255,90,80,0)");
        ctx.fillStyle = fgr;
        ctx.beginPath();
        ctx.moveTo(0, -19);
        ctx.bezierCurveTo(6.5, -12, 7.5, -3, 0, 0.5);
        ctx.bezierCurveTo(-7.5, -3, -6.5, -12, 0, -19);
        ctx.fill();
        ctx.restore();
        ctx.globalCompositeOperation = "source-over";
      }
    }

    // 烟
    for (const s of smoke) {
      ctx.globalAlpha = Math.max(0, s.life) * 0.30;
      ctx.fillStyle = "#d9c6cf";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function setHint(txt) {
    const el = document.getElementById("hint");
    el.textContent = txt;
    el.classList.add("on");
  }

  function setWish(on) {
    document.getElementById("wish").classList.toggle("on", !!on);
  }

  /* ---------------- 绘制 ---------------- */
  function draw(dt, t) {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = "lighter";

    const gatherT = Math.min(1, Math.max(0, (t - 120) / T.gather));
    const holdEnd = 120 + T.gather + T.hold;
    const dissolveT = Math.min(1, Math.max(0, (t - holdEnd) / T.dissolve));

    if (still !== "card" && (phase === "gather" || phase === "hold")) {
      const ease = 1 - Math.pow(1 - gatherT, 4);
      for (const p of particles) {
        const k = Math.max(0, Math.min(1, (ease - p.delay) / (1 - p.delay + 1e-6)));
        const e = 1 - Math.pow(1 - k, 3);
        p.x += (p.tx - p.x) * (0.02 + 0.14 * e);
        p.y += (p.ty - p.y) * (0.02 + 0.14 * e);

        // 轻微呼吸
        const br = 1 + Math.sin(t / 900 + p.tw) * 0.28 * e;
        const a = 0.25 + 0.75 * e;
        ctx.globalAlpha = a * br * 0.85;
        const s = p.size * (2.4 + 1.5 * br);
        ctx.drawImage(SPRITES[p.ci], p.x - s / 2, p.y - s / 2, s, s);
      }
    } else if (still !== "card") {
      // 散开：变成漂浮的金尘
      for (const p of particles) {
        if (!p.fv) {
          const a = Math.random() * Math.PI * 2;
          const sp = 0.6 + Math.random() * 3.2;
          p.fv = { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6 };
        }
        p.x += p.fv.vx;
        p.y += p.fv.vy;
        p.fv.vx *= 0.992;
        p.fv.vy = p.fv.vy * 0.992 + 0.012;
        ctx.globalAlpha = 0.45 * (1 - dissolveT * 0.6);
        const ds = p.size * 2.2;
        ctx.drawImage(SPRITES[p.ci], p.x - ds / 2, p.y - ds / 2, ds, ds);
      }
    }

    // 烟花
    for (let i = fireworks.length - 1; i >= 0; i--) {
      const f = fireworks[i];
      f.x += f.vx; f.y += f.vy;
      f.vy += 0.028;
      f.vx *= 0.985; f.vy *= 0.985;
      f.life -= f.decay;
      if (f.life <= 0) { fireworks.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(0, f.life);
      const fs = f.size * 3.4;
      ctx.drawImage(SPRITES[f.ci], f.x - fs / 2, f.y - fs / 2, fs, fs);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---------------- 主循环 ---------------- */
  let last = performance.now();
  let cardShown = false;
  let nextBurst = 0;

  function loop(ts) {
    const dt = Math.min(48, ts - last);
    last = ts;

    if (mode === "candles") {
      updateCandles(dt, ts);
      drawCake(ts);
      requestAnimationFrame(loop);
      return;
    }

    const t = still ? (120 + T.gather + 400) : now();

    if (still === "card" && !cardShown) {
      cardShown = true;
      document.getElementById("card").classList.add("on");
      document.getElementById("hint").classList.add("on");
      spawnFirework(W * 0.24, H * 0.30);
      spawnFirework(W * 0.78, H * 0.24);
    }
    if (still === "text" && !cardShown) {
      cardShown = true;   // 只定格粒子字，卡片保持隐藏
    }

    // 阶段推进
    const holdEnd = 120 + T.gather + T.hold;
    if (t < holdEnd) phase = "gather";
    else if (t < holdEnd + T.dissolve) phase = "dissolve";
    else phase = "after";

    if (phase === "dissolve" && t > holdEnd + 200 && t - nextBurst > 420) {
      nextBurst = t;
      spawnFirework(
        W * (0.2 + Math.random() * 0.6),
        H * (0.18 + Math.random() * 0.4)
      );
    }

    if (!cardShown && t > holdEnd + 500) {
      cardShown = true;
      document.getElementById("card").classList.add("on");
      document.getElementById("hint").classList.add("on");
    }

    draw(dt, t);
    requestAnimationFrame(loop);
  }

  /* ---------------- 交互 ---------------- */
  function burstAt(e) {
    const x = e.clientX ?? (e.touches && e.touches[0].clientX) ?? W / 2;
    const y = e.clientY ?? (e.touches && e.touches[0].clientY) ?? H / 2;
    spawnFirework(x, y);
    if (audioOn) chime();
  }
  addEventListener("pointerdown", (e) => {
    if (mode === "candles") { blowing = true; return; }
    burstAt(e);
  }, { passive: true });
  addEventListener("pointerup", () => { blowing = false; }, { passive: true });
  addEventListener("pointercancel", () => { blowing = false; }, { passive: true });
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); if (mode === "candles") blowing = true; }
  }, { passive: false });
  addEventListener("keyup", (e) => { if (e.code === "Space") blowing = false; });
  addEventListener("contextmenu", (e) => e.preventDefault());   // 微信里长按不弹菜单

  document.getElementById("again").addEventListener("click", (e) => {
    e.stopPropagation();
    replay();
  });

  function replay() {
    document.getElementById("card").classList.remove("on");
    document.getElementById("hint").classList.remove("on");
    cardShown = false;
    phase = "gather";
    fireworks = [];
    buildParticles();
    t0 = performance.now();
  }

  /* ---------------- 音效（WebAudio 合成，无外部文件） ---------------- */
  let actx = null, audioOn = false;
  const soundBtn = document.getElementById("sound");
  soundBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    audioOn = !audioOn;
    soundBtn.textContent = audioOn ? "关闭声音" : "开启声音";
    if (audioOn) {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      chime();
    }
  });

  function chime() {
    if (!actx) return;
    const t = actx.currentTime;
    [880, 1320, 1760].forEach((f, i) => {
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = "sine";
      o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.045);
      g.gain.linearRampToValueAtTime(0.06, t + i * 0.045 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.045 + 0.9);
      o.connect(g).connect(actx.destination);
      o.start(t + i * 0.045);
      o.stop(t + i * 0.045 + 1);
    });
  }

  /* ---------------- 启动 / 密码门 ---------------- */
  let started = false;

  function start() {
    if (started) return;
    started = true;
    resize();

    if (still === "candles") {
      mode = "candles";
      layoutCandles();
      setWish(true);
      setHint("按住屏幕 或 空格 · 吹熄蜡烛");
    } else if (still) {
      mode = "text";
      t0 = performance.now() - (parseFloat(qs.get("t")) || 0) * 1000;
      buildParticles();
    } else {
      mode = "candles";
      layoutCandles();
      setWish(true);
      setHint("按住屏幕 或 空格 · 吹熄蜡烛");
    }
    requestAnimationFrame(loop);
  }

  addEventListener("resize", () => {
    if (!started) return;
    resize();
    if (mode === "candles") layoutCandles(); else buildParticles();
  });

  const lock = document.getElementById("lock");
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");

  function tryUnlock() {
    if (pw.value.trim() === PASS) {
      try { sessionStorage.setItem("bday-unlocked", "1"); } catch (e) {}
      lock.classList.add("gone");
      setTimeout(() => lock.remove(), 900);
      start();
    } else {
      err.textContent = "密码不对，再试一次";
      lock.classList.add("shake");
      setTimeout(() => lock.classList.remove("shake"), 460);
      pw.value = "";
      pw.focus();
    }
  }

  if (still || sessionStorage.getItem("bday-unlocked") === "1") {
    lock.remove();
    start();
  } else {
    document.getElementById("enter").addEventListener("click", tryUnlock);
    pw.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
    setTimeout(() => pw.focus(), 400);
  }
})();
</script>
</body>
</html>
